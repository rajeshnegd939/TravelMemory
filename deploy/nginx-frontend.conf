# nginx config for the TravelMemory frontend (React production build)
# Copy to: /etc/nginx/sites-available/default

server {
    listen 80 default_server;
    server_name _;

    root /var/www/travelmemory;
    index index.html;

    # send unknown paths to index.html so React Router works on refresh
    location / {
        try_files $uri /index.html;
    }

    # static files from the build have hashed names, safe to cache
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
